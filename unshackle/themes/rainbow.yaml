# The unshackle colours with every gradient on: an example of what `gradients` can do.
author: unshackle
description: Default colours with a rainbow banner, progress bars, rules and panel borders.

bg: "#1e1e2e"
text: "#cdd6f4"
text2: "#a2a9c1"
black: "#45475a"
bright_black: "#585b70"
red: "#f38ba8"
green: "#a6e3a1"
yellow: "#f9e2af"
blue: "#89b4fa"
pink: "#f5c2e7"
cyan: "#94e2d5"
gray: "#9399b2"
bright_gray: "#bac2de"
dark_gray: "#313244"

styles:
  progress.data.speed: "#fab387"

gradients:
  direction: diagonal
  motion: scroll
  banner: [red, "#fab387", yellow, green, cyan, blue, pink]
  bar: [red, yellow, green, cyan, blue, pink]
  pulse: [dark_gray, red, yellow, green, blue, pink]
  rule: [red, yellow, green, cyan, blue, pink]
  panel: [red, yellow, green, blue]
